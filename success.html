<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Received | Desert Crescent Preparatory Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dcpaGreen: '#1B3022',
                        dcpaGold: '#D4AF37',
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800 bg-gray-50 min-h-screen flex flex-col">
    <!-- Simple Header -->
    <header class="bg-dcpaGreen text-white py-6 px-6">
        <div class="container mx-auto flex justify-center">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-dcpaGold rounded-full flex items-center justify-center text-dcpaGreen font-bold text-[8px] text-center p-1">DCPA</div>
                <h1 class="text-xl font-bold uppercase tracking-widest">Desert Crescent</h1>
            </a>
        </div>
    </header>

    <!-- Success Content -->
    <main class="flex-grow flex items-center justify-center py-20 px-6">
        <div class="max-w-md w-full bg-white p-12 rounded-2xl shadow-2xl text-center border-t-8 border-dcpaGold">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                <i class="fas fa-check"></i>
            </div>
            <h2 class="text-3xl font-serif font-bold text-dcpaGreen mb-4">Application Received!</h2>
            <p class="text-gray-600 mb-8">Thank you for your interest in DCPA. Our admissions team has received your inquiry and will contact you within 2 business days.</p>
            <a href="index.html" class="inline-block bg-dcpaGreen text-white font-bold px-8 py-3 rounded-lg hover:bg-dcpaLightGreen transition shadow-md">RETURN HOME</a>
        </div>
    </main>

    <footer class="bg-dcpaGreen text-white py-8 text-center text-xs opacity-60">
        <p>&copy; 2024 Desert Crescent Preparatory Academy. <br> www.desertcrescent.org</p>
    </footer>
</body>
</html>
